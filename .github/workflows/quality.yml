name: Quality

on:
  push:
    branches:
      - main
      - dev
  pull_request:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: wazepos
          POSTGRES_USER: wazepos
          POSTGRES_PASSWORD: wazepos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wazepos -d wazepos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Scan tracked files for populated secrets
        run: npm run security:secrets

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Migrate database
        run: npm run db:migrate
        env:
          DATABASE_URL: postgresql://wazepos:wazepos@127.0.0.1:5432/wazepos

      - name: Test
        run: npm test
        env:
          TEST_DATABASE_URL: postgresql://wazepos:wazepos@127.0.0.1:5432/wazepos

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://wazepos:wazepos@127.0.0.1:5432/wazepos
          BETTER_AUTH_SECRET: ci-only-secret-with-at-least-32-characters
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

  docker-smoke:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build app image
        run: docker compose --profile prod build app

      - name: Start postgres and app
        run: docker compose --profile prod up -d
        env:
          BETTER_AUTH_SECRET: ci-only-secret-with-at-least-32-characters
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          APP_PORT: 3100

      - name: Wait for liveness probe
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3100/api/live > /dev/null; then
              echo "App is live (attempt ${attempt})."
              exit 0
            fi
            sleep 5
          done
          echo "App did not become live in time." >&2
          docker compose --profile prod logs app postgres
          exit 1
        env:
          APP_PORT: 3100

      - name: Collect container logs on failure
        if: failure()
        run: docker compose --profile prod logs app postgres

      - name: Stop containers
        if: always()
        run: docker compose --profile prod down -v
